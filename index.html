<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gabriel Moraes de Oliveira — Portfólio</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #111827;
                color: #f9fafb;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            }
            main {
                text-align: center;
                padding: 2rem;
            }
            h1 {
                margin-bottom: 0.5rem;
            }
            p {
                color: #9ca3af;
                margin-bottom: 2rem;
            }
            .links {
                display: flex;
                gap: 1rem;
                justify-content: center;
                flex-wrap: wrap;
            }
            .links a {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.75rem 1.5rem;
                border-radius: 0.5rem;
                text-decoration: none;
                font-weight: 600;
                border: 1px solid #374151;
                color: #f9fafb;
                transition: background 0.15s ease;
            }
            .links a:hover {
                background: #1f2937;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Gabriel Moraes de Oliveira</h1>
            <p>Escolha qual versão do portfólio abrir</p>
            <div class="links">
                <a href="bootstrap/index.html">Versão Bootstrap</a>
                <a href="tailwind/index.html">Versão Tailwind</a>
            </div>
        </main>
    </body>
</html>
